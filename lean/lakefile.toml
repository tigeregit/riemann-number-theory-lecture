# Lean 4 project accompanying the lecture notes.
# All files are checked against mathlib v4.36.0 (see lean-toolchain).
name = "Riemann"
version = "0.1.0"
defaultTargets = ["Riemann"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = true
linter.unusedVariables = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Riemann"
roots = ["Riemann"]

[[lean_exe]]
name = "demo"
root = "Main"
